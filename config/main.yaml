defaults:
  - dataset: renbody
  - model/encoder: pointsplat
  - model/decoder: splatting_gsplat
  - loss: [mae]

mode: test
output_dir: outputs/tmp

hydra:
  run:
    dir: ${output_dir}/hydra_run/${now:%Y-%m-%d_%H-%M-%S}

data_loader:
  train:
    num_workers: 4
    persistent_workers: true
    batch_size: 1
    seed: 1234
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345

optimizer:
  lr: 1.0e-4
  weight_decay: 0.01

checkpointing:
  load: null
  every_n_train_steps: 5000
  save_top_k: 5
  pretrained_model: null
  pretrained_depth: null
  pretrained_encoder: null
  pretrained_decoder: null
  no_strict_load: false
  resume: false

trainer:
  seed: 111123
  num_nodes: 1
  max_steps: -1
  val_check_interval: 0.5
  gradient_clip_val: 0.5
  num_sanity_val_steps: 2
  log_every_n_steps: 10
  precision: 32-true
  use_plugins: false

train:
  depth_mode: null
  print_log_every_n_steps: 100
  vis_every_n_steps: 2000
  train_ignore_large_loss: 0.0
  mask_target: false
  mask_output: false

test:
  output_path: outputs/test
  compute_scores: true
  eval_time_skip_steps: 0
  save_image: true
  save_video: false
  save_gt_image: true
  save_input_images: true
  save_depth: false
  save_depth_npy: false
  save_depth_concat_img: false
  save_gaussian: false
  render_chunk_size: null
  stablize_camera: false
  stab_camera_kernel: 50
  mask_output: true
  move_to_cpu: true
  downsample_context_ratio: 1.0
